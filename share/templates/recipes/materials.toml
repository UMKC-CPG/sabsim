# =====================================================================
# SABSIM materials catalogue — one entry per material the repository
# ships a force-model recipe for (DESIGN.md §10.9).
# ---------------------------------------------------------------------
# `sabsim init <folder> --materials <a> <b>` looks the two labels up
# here (case-insensitively) and writes the project file's two wafer
# tables from the entry: the CANONICAL label (it also names the prep
# folder, lower-cased), the crystal file the builder reads, the human
# structure label, the bonding face, and which recipe template is this
# material's. Run without --materials, `init` prints this catalogue.
#
# A material that is not here is not guessed: `init` refuses it and
# prints the list. To add one, add its recipe template beside this
# file (`<label lower-cased>.toml`) and an entry below; the recipe's
# [[phases]] crystal and [[collection1.surfaces]] face should agree
# with the entry, so the library is built for the face that is bonded.
# =====================================================================

[Si]
recipe    = "si.toml"
cif       = "src/sabsim/structure/data/si_diamond.cif"
structure = "diamond"
face      = [1, 0, 0]

[SiO2]
# Alpha quartz is a stand-in for beta cristobalite, the lattice-matched
# silica against Si(100), whose CIF does not exist yet (see the project
# template's wafer_b comment).
recipe    = "sio2.toml"
cif       = "src/sabsim/structure/data/sio2_alpha_quartz.cif"
structure = "alpha-quartz"
face      = [0, 0, 1]
