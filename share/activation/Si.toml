# Activation-gate reference data for silicon (a-Si), DESIGN §3.5 / §10.6.
#
# STAND-INS, not the real anchors: literature-guided placeholders so the
# gate machinery runs end to end. Replace with a DFT / experimental g(r)
# and the group's amorphous-silicon continuous-random-network model when
# they are prepared. This file is exactly what load_activation_references
# reads, so a real reference of the same shape drops in unchanged. Every
# number here is a §3.6 / STRUCTURAL-1b DESIGN follow-on to pin.
real = false

# First minimum of the Si-Si g(r) — the bond cutoff the coordination and
# ring metrics use (~2.9 A for silicon). Deriving it from the measured
# g(r) is the follow-on; a stand-in constant is used for now.
bond_cutoff = 2.9

[gr]
# a-Si first-neighbour peak; the tolerance is deliberately coarse because
# g(r) is report-leaning (the curve is recorded for by-hand inspection).
first_peak = 2.35
first_peak_tolerance = 0.30

[coordination]
# a-Si is a continuous random network: still ~4-fold, but with a few
# percent of 3- and 5-coordinated defects. The band brackets "amorphized"
# between "barely damaged" and "wholesale destruction".
defect_fraction_min = 0.05
defect_fraction_max = 0.60

[rings]
# Five- and seven-membered rings appear in the amorphous network; require
# a meaningful non-six-ring share in the skin.
non_six_fraction_min = 0.15

[depth]
# The amorphized skin must reach at least this deep. UNLIKE every other
# number in this file, this one is NOT a literature stand-in: it was
# MEASURED by this pipeline. A 20-point energy x dose sweep (2026-07-21,
# 4400-atom slab 38.4 A wide x 55 A thick, 40-75 eV x 0.010-0.030
# ions/A^2) found the skin spans only 3.95-10.26 A and SATURATES in both
# knobs, with zero sputtering everywhere; the old 20 A value (from the
# ~2-3 nm target) is unreachable at any energy this cell tolerates,
# because the energies that would reach it over-sputter the slab. 7 A
# sits mid-window and comfortably above the ~5 A floor below which the
# skin degrades into a rough crystalline surface — mechanical interlock,
# a different regime from the SAB one modelled here. See DESIGN §3.6.
# STILL AN OPERATING THRESHOLD, NOT A PHYSICS-DERIVED ONE: the work-of-
# separation convergence study (dev/TODO.md skin-thickness item) is what
# replaces it with the thinnest skin that still gives the converged bond.
target_angstrom = 7.0
