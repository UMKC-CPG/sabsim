# =====================================================================
# SABSIM materials catalog entry (DESIGN.md §10.11). This folder IS the
# material: this file, its crystal file, and its force-model recipe.
# The folder's name is derived from the three values below —
# <formula>_<phase>_<face>, lower-cased — and `sabsim catalog` refuses
# a mismatch, so a reader can trust the name without opening this.
# =====================================================================
formula   = "SiO2"
phase     = "quartz"
face      = [0, 0, 1]
cif       = "sio2_alpha_quartz.cif"

[provenance]
# Alpha quartz, verbatim from the Crystallography Open Database. It is
# a STAND-IN for beta cristobalite, the lattice-matched silica against
# Si(100), until that entry exists (see the project template).
source       = "Crystallography Open Database"
cod_id       = 1011097
cod_revision = 303120
# The article the structure was published in, as the crystal file
# states it; the bracketed part is the database's own note on the
# years the journal carried that name.
reference    = """\
    Zeitschrift fuer Kristallographie, Kristallgeometrie, \
    Kristallphysik, Kristallchemie (-144,1977) 92, 355 (1935)"""
