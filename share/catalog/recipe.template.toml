@HEADER@
# The third input file, on its own clock: a potential is manufactured
# ONCE from this recipe, costing days of machine time, then consumed
# unchanged by many studies. It states, plainly enough for a student to
# read, what the model must cover (part 1), which calm structures are
# computed first (part 2, Collection 1), the accurate-calculation
# settings every label and every reference inherits (parts 3-4), how
# the hard configurations are harvested (part 5, Collection 2), and how
# many get the expensive labels (part 6). Parts 7-8 (the learning loop
# and the stopping rule) are added when `sabsim bootstrap train` lands.
#
# No hidden defaults (§1.4): the loader rejects a missing key. Units
# travel with values ({ value, unit }). Paths may use the location
# roots ($SABSIM_SHARE ...), expanded by the loader (ARCHITECTURE §4.1).
#
# CHEAP FIRST (Paul, 2026-08-26): every count and tolerance here is the
# smallest that exercises the whole process end to end. The cost is
# learned by spending; accuracy is dialled up afterwards.
# =====================================================================

[recipe]
# DERIVED: the catalog label, with the recipe's generation after it.
name          = "@RECIPE_NAME@"
# Part 1 — the key. The elements the ONE shared model must handle (this
# fixes the global type-map order, §4.3) and the structural/chemical
# regime it claims. A pair's material_domain must lie inside this.
# DERIVED: the crystal's elements, in the order of its reduced formula.
species_union = @SPECIES_UNION@
# DECIDE: the name of the regime this recipe claims to cover. It is a
# word you choose, and the project file's material_domain must lie
# inside it; the shipped recipes use "diamond-cubic" and
# "silicon-and-silica". No rule picks it and no check would catch it.
domain        = "DECIDE"
# Points at (never contains) the §3.5 reference set the gate uses.
# DERIVED: gate references are keyed by species set, the symbols
# sorted and joined by "_". If this file does not exist yet it has to
# be MADE for the species set; the loader refuses a missing one.
reference_data_ref = "@REFERENCE@"

# ---------------------------------------------------------------------
# The gate's RULER (DESIGN §3.5 / §4.8 part 2, 2026-08-29). The §3.5
# activation gate calls an atom crystalline when its second-shell
# bispectrum matches some neighbourhood of the UNDAMAGED material in
# the environment library this recipe's Collection 1 builds. These
# settings describe that neighbourhood, and they are recorded in the
# library so the gate reuses them — never a copy of its own. The cutoff
# is a PHYSICAL length through the SECOND neighbour shell and short of
# the third (LEDGER T-37 showed a first-shell cutoff cannot tell glass
# from warm crystal); LAMMPS's own parameters (rcutfac, per-species
# radii) are derived from it by the engine adapter. `expansion_order`
# is LAMMPS's twojmax (6 -> 30 components per atom, LEDGER T-35);
# `species_weights` tells unlike species apart inside one descriptor.
# `gate_scatter_multiple` is the tolerance the library is self-checked
# at: nearly every warm-run atom must read as crystalline and nearly
# every melt-quench atom as disordered, or `generate` refuses to write
# the library.
# ---------------------------------------------------------------------
[descriptor]
# ESTIMATE: the midpoint between the second and third neighbour shells
# of the crystal's sparsest species, counted among its own kind (the
# network-forming sublattice of a compound). The rule reproduces
# silicon's measured 4.2 A and gives 4.6 A for quartz, where 5.0 A
# measured best (LEDGER T-44): treat it as a start. CHECK: the
# library self-check in `sabsim bootstrap generate` refuses a ruler
# that cannot tell warm crystal from glass.
descriptor_cutoff    = @CUTOFF@
expansion_order       = 6
# ESTIMATE: 1, 1/2, 1/4 ... in species_union order. Any distinct
# values are accepted; the same self-check judges how well they work.
species_weights       = @WEIGHTS@
gate_scatter_multiple = 3.0

# The universal foundation model that RUNS the dynamics of Collection 1
# (melt-quench, warm runs) and derives the working lattice (§2.2). The
# same model, under the same name, that the project file's [potential]
# block names; the identity must match the one pinned in the code.
[generator]
model             = "DPA-3.1-3M"
weights           = "$SABSIM_SHARE/share/models/dpa_gpu_bench/v320fix/dpa3.pth"
allow_unvalidated = true
# Time step for the Collection-1 dynamics. One femtosecond has served
# every material run so far; a much lighter element or a much hotter
# melt than those may need a shorter one.
md_timestep       = { value = 1.0, unit = "fs" }

# ---------------------------------------------------------------------
# Part 2 — Collection 1, the calm structures. Six families, all required
# (§4.8 part 2). Each phase entry IS the domain's truth: a phase absent
# here was not taught, whatever the domain label says.
# ---------------------------------------------------------------------
[[phases]]
# DERIVED: the formula and the phase word, and this entry's crystal.
name = "@PHASE_NAME@"
cif  = "@CIF@"

[collection1.bulk]
# Family 1 — the perfect crystal at the lattice the GENERATOR model
# relaxes it to (§2.2), replicated so the cell is wider than twice the
# descriptor cutoff and no atom sees its own image.
# ESTIMATE: the smallest repeat of the crystal file's cell that clears
# twice the cutoff above; it moves if the cutoff does.
cells_per_axis = @BULK_CELLS@

[collection1.strain]
# Family 2 — the relaxed bulk cell deformed by each magnitude in each
# mode, carried past the reversible range (+-10 %): §7.2 gates the
# stiffness, and the pull is tension. "volumetric" scales all axes,
# "uniaxial_z" one axis, "shear_xy" tilts x along y. Static: no MD.
magnitudes = [-0.10, -0.05, -0.02, 0.02, 0.05, 0.10]
modes      = ["volumetric", "uniaxial_z", "shear_xy"]

[[collection1.melt_quench]]
# Family 3 — the bulk amorphous network: melt the cell far above
# melting, hold until it has forgotten the lattice, quench at a stated
# RATE, keep frames from the quench. One replica, ten frames: lean.
# ESTIMATE, both lines: a small periodic cell superheats instead of
# melting, so the start is what melted the hardest material so far
# (quartz, LEDGER T-43) — 5000 K, in the smallest cell of at least 200
# atoms that also clears twice the descriptor cutoff. An easier
# material melts cooler and smaller, and is cheaper to label. CHECK:
# `verify_melt` refuses a hold in which the atoms did not diffuse.
phase             = "@PHASE_NAME@"
cells_per_axis    = @MELT_CELLS@
melt_temperature  = @MELT_TEMPERATURE@
melt_duration     = { value = 5.0,    unit = "ps" }
quench_rate       = { value = 200.0,  unit = "K/ps" }
final_temperature = { value = 300.0,  unit = "K" }
replicas          = 1
frames            = 10
seed              = 11

[[collection1.surfaces]]
# Family 4 — the clean, unbombarded free surface: same face the studies
# bond, no damage. Cut by the §7 slab builder at the derived lattice.
phase             = "@PHASE_NAME@"
# DERIVED: the bonding face this catalog entry is for. Its sign
# counts: the face names the slab's top, the side that bonds (§2.5).
face              = @FACE@
# Which atomic plane the cut ends on, as a position in the builder's
# list of terminations; this file's opening comment says what each
# one ends on. DERIVED as 0 when the face has a single termination.
# DECIDE when it has more: nothing checks the choice, and it stands
# in for §2.5's selection by surface energy, which is not built yet.
termination_index = @TERMINATION@
slab_thickness    = { value = 10.0, unit = "angstrom" }
vacuum            = { value = 12.0, unit = "angstrom" }
# In-plane tiling of the slab's own surface cell. A 1x1 column is often
# narrower than the descriptor cutoff, so every atom would see its own
# image (LEDGER T-26).
# ESTIMATE: the smallest repeat that makes the surface cell wider than
# twice the cutoff above; it moves if the cutoff does.
lateral_repeat    = @LATERAL_REPEAT@

[collection1.rattle]
# Family 5 — seeded static displacements about the cold bulk cell.
amplitude = { value = 0.15, unit = "angstrom" }
count     = 10
seed      = 20260826

[[collection1.warm_runs]]
# Family 6 — short warm runs, NVT AND NPT (both required: NPT supplies
# thermal expansion, NVT correlated motion at fixed volume). Frames are
# harvested after the equilibration interval, spaced by the stride.
# 300 K, not hotter: warmer runs spread wide enough to swallow the
# glass the ruler must tell them from (LEDGER T-37).
phase           = "@PHASE_NAME@"
ensemble        = "NVT"
temperature     = { value = 300.0, unit = "K" }
duration        = { value = 4.0,   unit = "ps" }
equilibration   = { value = 1.0,   unit = "ps" }
sampling_stride = { value = 0.3,   unit = "ps" }
replicas        = 1
seed            = 21

[[collection1.warm_runs]]
phase           = "@PHASE_NAME@"
ensemble        = "NPT"
temperature     = { value = 300.0, unit = "K" }
duration        = { value = 4.0,   unit = "ps" }
equilibration   = { value = 1.0,   unit = "ps" }
sampling_stride = { value = 0.3,   unit = "ps" }
replicas        = 1
seed            = 22

# ---------------------------------------------------------------------
# Part 5 — Collection 2, the hard configurations (§4.8 part 5). NOT new
# MD: harvested from an ordinary PROJECT run recorded with
# `sabsim run --dump-visuals` under the universal model. `project` is
# that project's file; its folder holds the stage folders whose
# deliverables name the `run-<id>` scratch folders that carry the
# dumps. Families 7-11 come from the activate dumps (7),
# the press dump (8-10: initial / relaxed / pressed thirds of the press
# record) and the pull dumps (11). Interface frames are cut to the
# §6.4 sub-cell: the activated skins plus this many crystalline layers
# under each (Paul, 2026-08-26: the surface atoms are what training is
# for). `sabsim init` rewrites the `project` line below to the
# project folder it is writing; by hand, point it at the sabsim.toml
# two levels up from this recipe.
# ---------------------------------------------------------------------
[generation_plan]
project                     = "../sabsim.toml"
frames_per_stage            = { activate = 10, press = 12, pull = 10 }
subcell_crystalline_layers  = 2
subcell_vacuum              = { value = 10.0, unit = "angstrom" }

# ---------------------------------------------------------------------
# Part 6 — what gets labelled. In this first slice the selection is the
# budget alone: the first `budget_per_family` structures of each
# family, evenly strided. The interface-preference and uncertainty
# terms of §11.1's SelectionRule engage once a committee exists.
# ---------------------------------------------------------------------
[labelling]
budget_per_family = 10

# ---------------------------------------------------------------------
# Part 3 — the PRODUCTION settings block: the labels AND every reference
# that is differenced against the model inherit it unchanged (§4.8).
# The lean recipe of dev/notes/vasp-labelling-recipe-lean.md.
# ---------------------------------------------------------------------
[production_settings]
paw_library           = "$SABSIM_SHARE/vasp_pot/potpaw_PBE.54"
# Element -> PAW directory name in that library.
# DERIVED where an element has a directory of its own plain name, and
# that is the lean choice (the recipe note says why Li not Li_sv, O
# not O_s); `catalog add` listed the library's other candidates when
# it wrote this. DECIDE where it has none, or where the library could
# not be reached from where the command ran.
paw                   = @PAW@
functional            = "PBE"
plane_wave_cutoff     = { value = 350.0, unit = "eV" }
# A SPACING, never a mesh (§4.8): used only for the two bulk families
# when gamma_only_off_bulk is true; everything else is Gamma only.
reciprocal_spacing    = { value = 0.5, unit = "1/angstrom" }
gamma_only_off_bulk   = true
smearing_scheme       = "gaussian"
smearing_width        = { value = 0.10, unit = "eV" }
electronic_tolerance  = { value = 1.0e-4, unit = "eV" }
max_electronic_steps  = 60
spin_polarized        = false
real_space_projection = "Auto"
# Has the part-4 audit been run against these values? Not yet: every
# label from this recipe is EXPLORATORY until it has.
audited               = false

# Part 4 — the AUDIT block: tightened, run once on a few small cells so
# the method error is measured and reported beside the learning error.
[audit_settings]
paw_library           = "$SABSIM_SHARE/vasp_pot/potpaw_PBE.54"
# The same pseudopotentials as the production block, always.
paw                   = @PAW@
functional            = "PBE"
plane_wave_cutoff     = { value = 450.0, unit = "eV" }
reciprocal_spacing    = { value = 0.3, unit = "1/angstrom" }
gamma_only_off_bulk   = false
smearing_scheme       = "gaussian"
smearing_width        = { value = 0.05, unit = "eV" }
electronic_tolerance  = { value = 1.0e-6, unit = "eV" }
max_electronic_steps  = 120
spin_polarized        = false
real_space_projection = "False"
audited               = false
