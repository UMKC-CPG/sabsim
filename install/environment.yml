# environment.yml — SABSIM conda/mamba BASE layer (DRAFT, ARCHITECTURE §4.1)
# ==========================================================================
# The conda half of the SABSIM deployment stack, made reproducible. Build:
#     CONDA_OVERRIDE_CUDA=12.9 mamba env create -f environment.yml
# (the override is REQUIRED on the GPU-less login node — see the CUDA note
# below), then layer the venv on top (see build_venv.sh). The two together
# ARE the environment. This file is the "how to install SABSIM" record that
# did not exist before 2026-07-31. DRAFT: build under a DEV name
# (sabsim_dev), validate, then adopt (§4.1).
#
# MPI DECISION (validated 2026-07-31, job 15551674): the whole stack runs
#   on CONDA OpenMPI 5.0.10. deepmd-kit forces it into the env, and the
#   conda python's RPATH ($ORIGIN/../lib) makes its libmpi the one every
#   in-process `import` loads — so it is not a choice, it is what happens,
#   and it is the RIGHT answer: conda's OpenMPI 5.0.10 ships the full UCX
#   stack and drives this cluster's InfiniBand fabric at ~12 GB/s (UCX
#   picks rc_mlx5). No site OpenMPI is needed. The launcher is
#   `srun --mpi=pmix` (or `mpirun`) AFTER `unset SLURM_MEM_PER_NODE
#   SLURM_MEM_PER_CPU SLURM_MEM_PER_GPU` — the allocation exports those
#   mutually-exclusive, which otherwise aborts the launch (bake the unset
#   into every run script).
#
# TWO PRINCIPLES decide what this layer contains:
#
#  1. NO conda/pip `lammps` PACKAGE. A conda/pip lammps drops a competing
#     `liblammps.so` that the python RPATH loads ahead of anything else,
#     and its glibc floor kills it on the 2.28 nodes (probe 15520412).
#     LAMMPS instead comes from a SOURCE build made ON the cluster
#     (el8-native, glibc-safe) AND linked against THIS env's conda OpenMPI
#     5.0.10, installed into the venv — so it shares the one MPI. The site
#     `cpg_lammps` modules do NOT fit here: they are built against site
#     OpenMPI 4.1.5, which mismatches the conda 5.0.10 the python forces.
#     (The LAMMPS build script is the remaining task — see dev/TODO.md.)
#
#  2. `mpi4py` comes from CONDA (below), so it matches the conda OpenMPI
#     5.0.10 that actually loads. Do NOT pip-build it against some other
#     MPI — that only appeared to work because OpenMPI 4.x/5.x share the
#     `libmpi.so.40` ABI.
# ==========================================================================

# DEV name on purpose: build ALONGSIDE the production `sabsim`, validate,
#   THEN retire the old one and repoint the rc. Never destroy a working
#   env before its replacement passes the engine + activate + bond checks.
name: sabsim_dev

channels:
  - conda-forge

dependencies:
  # --- interpreter ------------------------------------------------------
  # Pin the minor: the deepmd / torch / tensorflow builds are cp311 wheels.
  - python=3.11

  # --- MLIP inference stack for the bond stage (pair_style deepmd) ------
  # deepmd-kit is PINNED because its prebuilt LAMMPS plugin is ABI-locked
  #   to LAMMPS 2024.08.29 (ARCHITECTURE §4.4). pytorch / tensorflow are
  #   deepmd's backends. deepmd-kit is also what pulls OpenMPI 5.0.10 —
  #   the MPI the whole env then uses (see the MPI DECISION above).
  - deepmd-kit=3.1.3
  - pytorch=2.11.*
  - tensorflow=2.19.*
  # Pin CUDA to the A100 nodes' level. NOTE: this pin does NOT force the
  #   GPU builds — the solver picks cuda* vs cpu_* from whether a GPU is
  #   visible, and the LOGIN node has none. You MUST build with:
  #       CONDA_OVERRIDE_CUDA=12.9 mamba env create -f environment.yml
  #   then verify deepmd-kit/pytorch/tensorflow show a `cuda*` build.
  - cuda-version=12.9

  # --- MPI: conda OpenMPI 5.0.10 + a matching mpi4py -------------------
  # mpi4py here (not the venv) so it links the same conda libmpi the RPATH
  #   loads. deepmd-kit already pulls openmpi 5.0.10; listing mpi4py makes
  #   the binding explicit and reproducible.
  - mpi4py
  # openmpi is pulled transitively at 5.0.10 by deepmd-kit + mpi4py; it
  #   ships the UCX stack that reaches the InfiniBand fabric.

  # --- scientific core (binary; cleanest from conda-forge) -------------
  - numpy=2.4.*
  - scipy=1.17.*
  # nompi h5py is correct — SABSIM's HDF5 I/O is not MPI-collective.
  - h5py=3.16.*
  - pandas
  - matplotlib

  # --- build toolchain for the LAMMPS source build ---------------------
  # LAMMPS is built from source against THIS env's conda OpenMPI 5.0.10
  #   (install/build_lammps.sh), so the conda C/C++ compiler + cmake +
  #   make + FFTW must be in the env. Building with the CONDA toolchain
  #   (not the site gcc) means the LAMMPS binary uses conda's libstdc++
  #   (16), which matches the deepmd plugin's CXXABI — likely removing the
  #   LD_PRELOAD dance the site build needed.
  - cxx-compiler
  - cmake
  - make
  - fftw
  # LAMMPS optional-package deps — provide what packages need rather than
  #   trimming LAMMPS. COMPRESS needs zlib HEADERS (the env ships only the
  #   runtime libzlib). Add libpng / libcurl here too if WITH_PNG /
  #   WITH_CURL are enabled in build_lammps.sh.
  - zlib

  # --- housekeeping (explicitly requested in the old env's history) ----
  - ca-certificates
  - openssl

  # === DELIBERATELY ABSENT — do NOT add back ===========================
  #   lammps  -> SOURCE-built against this env's conda OpenMPI 5.0.10,
  #              el8-native, into the venv (principle 1; build TBD).
  #   ase / pymatgen / parsl / ALF / sabsim -> the VENV layer (pip),
  #              version-pinned + editable. See build_venv.sh.
