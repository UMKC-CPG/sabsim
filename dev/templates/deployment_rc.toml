# =====================================================================
# SABSIM deployment configuration (the "rc" file) — machine-local
# ---------------------------------------------------------------------
# This is the ONLY input route outside the study spec (DESIGN.md §1.2),
# and it is deployment-ONLY: it NEVER layers a scientific or numerical
# default into the study, so nothing that moves the answer can hide here
# (ARCHITECTURE.md §4.1). Physics lives in the CWD study spec; only
# "where to run" lives here.
#
# It carries TWO concerns in ONE file:
#   [hardware]   what this cluster HAS  (the per-cluster swap unit)
#   [usage.*]    how to USE it, keyed by KIND OF MEMBER JOB (activate /
#                bond / analyze), not by script or by tool
# Routing is per job, not per step (§4.1). Move to a new machine by
# swapping the [hardware] block; the usage map keeps working unchanged.
#
# EXCLUDED here on purpose: Tier-B tools that own their own Parsl/SLURM
# (ALF, Kaleidoscope). There is no Parsl-in-Parsl (§4.1 wall 5), so we
# do not route their internal steps. The values below are EXAMPLES for
# the local admin to set; they are not defaults baked into the code.
# =====================================================================

[hardware]
# The per-cluster swap unit: replace this block to move machines.
# The tools to switch on are NOT listed here — they live per KIND OF
# JOB, in each [usage.*] block below, so a job loads only what it needs
# and nothing that could conflict with it (DESIGN.md §10.5).
cluster_name    = "pixstor"
scheduler       = "slurm"
default_account = "cpg"
# Extra MODULEPATH roots to `module use` before any `module load` below.
# The CPG-owned modulefile tree that publishes the LAMMPS engines
# (cpg_lammps/*) is NOT on the default path, so it must be added here
# (ARCHITECTURE.md §4.4). Stock site modules like VASP need none of this.
module_paths    = ["/cluster/VAST/rulisp-lab/cpg/modulefiles"]

  [hardware.partitions.cpu]
  name           = "general"
  cores_per_node = 64
  max_walltime   = { value = 48.0, unit = "h" }

  [hardware.partitions.gpu]
  name          = "gpu"
  gpus_per_node = 4
  max_walltime  = { value = 24.0, unit = "h" }

# ---------------------------------------------------------------------
# Usage map: one block per KIND OF MEMBER JOB (DESIGN.md §10.2), NOT per
# tool. The "partition" seam names an abstract resource class the
# [hardware] section resolves, so the same map survives a hardware swap.
# The three v1 job kinds are the ones `sabsim prepare` writes and
# `sabsim run --activate|--bond|--analyze` executes (PSEUDOCODE.md §14):
# activate, bond, analyze. (An earlier draft keyed this map by tool —
# cascade-md / bond-md / vasp / sequence; DESIGN §10 replaced that axis.)
# ---------------------------------------------------------------------
[usage.activate]
# Build both wafers, roughen both surfaces with the classical + ZBL
# cascade (§3), and bring them together — CPU-bound LAMMPS. The cheap
# build-and-assemble glue rides along with the heavy cascade (§10.2).
partition = "cpu"
nodes     = 2
walltime  = { value = 12.0, unit = "h" }
modules   = ["cpg_lammps/22Jul2025"]  # the classical + ZBL engine

[usage.bond]
# Press, settle, and pull on the MLIP committee (§5): GPU-accelerated
# DeePMD evaluation, all committee models in the one process (§10.2).
partition = "gpu"
nodes     = 1
walltime  = { value = 18.0, unit = "h" }
# The GPU force model is a DeePMD pair style hosted inside LAMMPS. It is
# NOT a separate module: the engine here is a version of LAMMPS built to
# ABI-match the prebuilt DeePMD plugin, and the LAMMPS input loads that
# plugin at run time (variable dp getenv DEEPMD_LMP_PLUGIN; plugin load
# ${dp}); the module also LD_PRELOADs the libstdc++ the backend needs
# (ARCHITECTURE.md §4.4). So this kind loads ONE engine module.
modules   = ["cpg_lammps/2024.08.29-deepmd"]

[usage.analyze]
# Turn the pull result into the measure vector (§6): CPU. In v1 the only
# real measure is the mechanical work-integral (M1), which is pure Python
# and loads NO science module. The all-electron characterization (§8)
# that will eventually run here is Kaleidoscope/Imago — Tier B, which
# owns its own submission (ARCHITECTURE.md §4.1) — so nothing is keyed
# for it here; a DIRECT electronic-structure tool would be added only if
# one is ever run outside that Parsl loop.
partition = "cpu"
nodes     = 1
walltime  = { value = 4.0, unit = "h" }
modules   = []
